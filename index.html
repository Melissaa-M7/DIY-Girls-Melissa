<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My AI Assistant Builder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ==============================================
         STUDENTS: EDIT THIS HEADER!
         ============================================== -->
    <div class="header">
        <div class="header__badge" aria-hidden="true"></div>
        <h1>Capuina</h1>
        <p>Built by: Melissa</p>
        <span class="header__status">Online &amp; ready</span>
    </div>

    <div class="container">
        <!-- Configuration Panel -->
        <!-- Hidden from visitors. The fields below stay in the page because
             script.js reads the system prompt and welcome message from them. -->
        <div class="config-panel" hidden>
            <!-- <h2>⚙️ Configure Your Assistant</h2>

            <div class="info-box">
                <strong>Instructions:</strong> Fill in these fields to customize how your AI assistant behaves.
            </div> -->

            <div class="config-section">
                <label for="assistantName">Assistant Name:</label>
                <input
                    type="text"
                    id="assistantName"
                    placeholder="e.g., TrailGuide, StudyBuddy, CampingPro"
                    value="My assistant"
                >
            </div>

            <div class="config-section">
                <label for="systemPrompt">System Prompt (What should your assistant do?):</label>
                <textarea
                    id="systemPrompt"
                    placeholder="Example: You are a helpful trail safety advisor. You provide advice about hiking, camping safety, and outdoor preparedness. Always be encouraging and emphasize safety first."
                >You are capuina, a friendly coffee expert.You provide personalized coffee recommendations based on preferences. You can help find coffe places to try. You can also help with explaining different coffee types and textures. You are talking to anyone. Your tone will be warm, kind and jolly also a little cute. keep answers under 7 sentences. Use everyday lanuage. No formal or scientific lanuage. Never judge anyone's perferneces. If they ask about something other than coffee, politely redirect them back to coffee.If your'e not sure, say:I'm not sure about this one. Sorry try a different question. </textarea>
            </div>

            <div class="config-section">
                <label for="welcomeMessage">Welcome Message:</label>
                <input
                    type="text"
                    id="welcomeMessage"
                    placeholder="What should your assistant say when it starts?"
                    value="Hii! Im Capuina, you favorite coffee expert. How can i help you?"
                >
            </div>
        </div>

        <!-- Chat Interface -->
        <div class="chat-container">
            <div class="messages" id="messages">
                <!-- Messages will appear here -->
            </div>
            <div class="input-area">
                <input
                    type="text"
                    id="userInput"
                    placeholder="What's your coffee question for today?"
                    onkeypress="if(event.key === 'Enter') sendMessage()"
                >
                <button onclick="sendMessage()" id="sendBtn">Lets Go!</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
